# Full self-host stack. Quick start:
#   cp .env.example .env   # then set ENCRYPTION_KEYS and SESSION_SECRET
#   docker compose up -d
# Open http://localhost (web) and http://localhost:8025 (Mailpit, dev email inbox).
name: lumen

x-server-env: &server-env
  NODE_ENV: production
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
  API_URL: ${PUBLIC_URL:-http://localhost}
  TRUST_PROXY: 'true'
  DATABASE_URL: postgres://lumen:${POSTGRES_PASSWORD:-lumen}@postgres:5432/lumen
  REDIS_URL: redis://redis:6379
  ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?set ENCRYPTION_KEYS in .env}
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: lumen
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-lumen}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-lumen-minio-secret}
  EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  EMAIL_FROM: ${EMAIL_FROM:-Lumen <no-reply@localhost>}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumen}
      POSTGRES_DB: lumen
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U lumen'], interval: 5s, retries: 10 }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redisdata:/data]
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 5s, retries: 10 }
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lumen}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lumen-minio-secret}
    volumes: [miniodata:/data]
    healthcheck: { test: ['CMD', 'mc', 'ready', 'local'], interval: 5s, retries: 10 }
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-lumen} $${MINIO_ROOT_PASSWORD:-lumen-minio-secret}
      && mc mb --ignore-existing local/lumen && mc anonymous set none local/lumen"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lumen}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lumen-minio-secret}

  mailpit:
    image: axllent/mailpit:latest
    ports: ['8025:8025']
    restart: unless-stopped

  server:
    build: { context: ., dockerfile: infra/docker/server.Dockerfile }
    environment: *server-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      API_UPSTREAM: server:3000
    ports: ['80:80', '443:443']
    volumes: [caddydata:/data]
    depends_on: { server: { condition: service_healthy } }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
