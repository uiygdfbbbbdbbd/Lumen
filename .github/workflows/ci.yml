name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  static:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test:unit
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: unit-coverage, path: '**/coverage/**', if-no-files-found: ignore }

  integration:
    name: Integration + security tests (Postgres, Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@lumen/shared --filter=@lumen/email-templates
      - name: Integration + security with merged coverage (thresholds enforced)
        run: pnpm --filter @lumen/server test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: server-coverage, path: apps/server/coverage }

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client redis-tools
      - run: pnpm --filter @lumen/e2e exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter @lumen/e2e exec playwright test --shard=${{ matrix.shard }}/2
        env: { E2E_ALL_BROWSERS: '1', CI: '1' }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report-${{ matrix.shard }}, path: tests/e2e/playwright-report }

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (fail on high/critical)
        run: pnpm audit --audit-level=high --prod
      - name: Secrets in repo
        run: node scripts/scan-secrets.mjs
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Semgrep (SAST)
        run: pipx run semgrep scan --config p/typescript --config p/nodejsscan --config p/secrets --error --severity ERROR

  build:
    name: Build apps + Docker images
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      - name: Bundle size budget
        run: node scripts/check-bundle-size.mjs
      - run: docker build -f infra/docker/server.Dockerfile -t lumen-server:ci .
      - run: docker build -f infra/docker/web.Dockerfile -t lumen-web:ci .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: 'lumen-server:ci', severity: 'HIGH,CRITICAL', exit-code: '1', ignore-unfixed: true }
      - name: Self-host smoke test (docker compose up)
        run: |
          cp .env.compose.example .env
          sed -i "s|^ENCRYPTION_KEYS=.*|ENCRYPTION_KEYS=$(openssl rand -base64 32)|; s|^SESSION_SECRET=.*|SESSION_SECRET=$(openssl rand -hex 32)|" .env
          docker tag lumen-server:ci lumen-server && docker tag lumen-web:ci lumen-web
          docker compose up -d --no-build --wait --wait-timeout 180
          curl -fsS http://localhost/api/health
          curl -fsS -o /dev/null http://localhost/
      - if: failure()
        run: docker compose logs --no-color | tail -200
